name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Download one month of TLC data
        run: |
          mkdir -p data/raw
          curl -sSfL -o data/raw/yellow_tripdata_2024-01.parquet \
            https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_2024-01.parquet
          curl -sSfL -o data/raw/taxi_zone_lookup.csv \
            https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv

      - name: Install dbt packages
        run: dbt deps

      - name: Check connection
        run: dbt debug

      - name: Build and test all models
        run: dbt build